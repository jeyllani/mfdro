[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfdro"
dynamic = ["version"]
description = "Point-in-time multi-frequency ambiguity signals for distributionally robust optimization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Abdul Kadir Jeylani Bakari", email = "abdul.bakari@gmail.com"},
]
maintainers = [
  {name = "Abdul Kadir Jeylani Bakari", email = "abdul.bakari@gmail.com"},
]
keywords = [
  "distributionally robust optimization",
  "optimal transport",
  "portfolio optimization",
  "sliced wasserstein",
  "wasserstein barycenter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "POT>=0.9.4",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/jeyllani/mfdro"
Documentation = "https://jeyllani.github.io/mfdro/"
Source = "https://github.com/jeyllani/mfdro"
Issues = "https://github.com/jeyllani/mfdro/issues"
Changelog = "https://github.com/jeyllani/mfdro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
notebooks = [
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "yfinance>=1.5,<2",
]
dev = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "ruff>=0.8",
  "twine>=5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfdro = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "mfdro.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mfdro"]

[tool.coverage.report]
fail_under = 95
precision = 1
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
packages = ["mfdro"]
strict = true
warn_unreachable = true
warn_redundant_casts = false

[[tool.mypy.overrides]]
module = ["ot", "ot.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
